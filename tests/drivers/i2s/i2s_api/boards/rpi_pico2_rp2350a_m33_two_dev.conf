# Two-device variant of the GPIO-loopback I2S test on rpi_pico2.
#
# Layered on top of boards/rpi_pico2_rp2350a_m33.conf, which twister applies
# automatically for this board target. Only the delta belongs here.
#
# i2s-node0 (pio0) runs RX as clock *target*; i2s-node1 (pio1) runs TX as
# clock controller. See rpi_pico2_rp2350a_m33_two_dev.overlay for the wiring.

CONFIG_I2S_TEST_SEPARATE_DEVICES=y
